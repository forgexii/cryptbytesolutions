{% extends "dashboard/base_dashboard.html" %}
{% load static %}

{% block dash_content %}

  <div class="dash-panel dash-panel--confirm-delete" data-animate>
    <div class="delete-icon-wrap" aria-hidden="true">
      <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
    </div>

    <h2 class="delete-title">Confirm Deletion</h2>
    <p class="delete-text">
      Are you sure you want to permanently delete the {{ object_type }} <strong>"{{ object_name }}"</strong>?
      This action cannot be undone.
    </p>

    <form method="post" class="delete-form">
      {% csrf_token %}
      <button type="submit" class="btn btn--danger">
        Yes, Permanently Delete
      </button>
      <a href="{% url cancel_url %}" class="btn btn--outline">
        Cancel &amp; Go Back
      </a>
    </form>
  </div>

{% endblock %}
